<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel – Prime Video</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0a0e1a;color:#e2e8f0;min-height:100vh}
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:#111827;border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:40px;width:360px;text-align:center}
.login-box h1{font-size:22px;font-weight:800;margin-bottom:6px}
.login-box h1 span{color:#00a8e1}
.login-box p{color:#64748b;font-size:13px;margin-bottom:24px}
.login-box input{width:100%;padding:11px 14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:8px;color:#fff;font-size:14px;margin-bottom:12px;outline:none}
.login-box input:focus{border-color:#00a8e1}
.login-box button{width:100%;padding:12px;background:#00a8e1;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer}
.login-box button:hover{background:#0082b0}
.error-msg{color:#ef4444;font-size:13px;margin-top:8px;display:none}
.dashboard{display:none}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:#111827;border-right:1px solid rgba(255,255,255,0.07);padding:24px 0}
.sidebar-logo{padding:0 20px 24px;font-size:18px;font-weight:800;border-bottom:1px solid rgba(255,255,255,0.07)}
.sidebar-logo span{color:#00a8e1}
.sidebar nav{margin-top:16px}
.sidebar nav a{display:flex;align-items:center;gap:10px;padding:12px 20px;color:#94a3b8;text-decoration:none;font-size:14px;font-weight:500;transition:all 0.2s}
.sidebar nav a:hover,.sidebar nav a.active{color:#fff;background:rgba(255,255,255,0.07)}
.sidebar nav a.active{border-right:3px solid #00a8e1}
.main{margin-left:220px;padding:28px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.topbar h2{font-size:22px;font-weight:700}
.topbar .admin-badge{background:rgba(0,168,225,0.15);color:#00a8e1;padding:5px 14px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid rgba(0,168,225,0.3)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:#111827;border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:20px}
.stat-card .label{color:#64748b;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.stat-card .value{font-size:32px;font-weight:800;color:#fff}
.stat-card .value.blue{color:#00a8e1}
.stat-card .value.green{color:#00c853}
.section{background:#111827;border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:20px;margin-bottom:20px}
.section-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;color:#64748b;font-weight:600;border-bottom:1px solid rgba(255,255,255,0.07);text-transform:uppercase;font-size:11px;letter-spacing:0.5px}
td{padding:12px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.02)}
.badge{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.badge.movie{background:rgba(0,168,225,0.15);color:#00a8e1}
.badge.show{background:rgba(167,139,250,0.15);color:#a78bfa}
.del-btn{background:rgba(239,68,68,0.12);color:#ef4444;border:none;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-weight:600}
.del-btn:hover{background:rgba(239,68,68,0.25)}
.add-btn{background:#00a8e1;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.add-btn:hover{background:#0082b0}
.tab-content{display:none}
.tab-content.active{display:block}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row input,.form-row select{padding:10px 12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-size:13px;outline:none;width:100%}
.form-row input:focus,.form-row select:focus{border-color:#00a8e1}
.form-row select option{background:#111827}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>prime <span>admin</span></h1>
    <p>Enter admin key to access dashboard</p>
    <input type="password" id="adminKeyInput" placeholder="Admin Key">
    <button onclick="doLogin()">Login</button>
    <div class="error-msg" id="loginError">Wrong admin key!</div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="sidebar">
    <div class="sidebar-logo">prime <span>admin</span></div>
    <nav>
      <a href="#" class="active" onclick="showTab('overview',this)">📊 Overview</a>
      <a href="#" onclick="showTab('users',this)">👥 Users</a>
      <a href="#" onclick="showTab('movies',this)">🎬 Movies</a>
      <a href="#" onclick="showTab('addmovie',this)">➕ Add Movie</a>
    </nav>
  </div>
  <div class="main">
    <div class="topbar">
      <h2 id="pageTitle">Overview</h2>
      <span class="admin-badge">🔐 Admin</span>
    </div>

    <!-- OVERVIEW -->
    <div class="tab-content active" id="tab-overview">
      <div class="stats-grid">
        <div class="stat-card"><div class="label">Total Users</div><div class="value blue" id="statUsers">-</div></div>
        <div class="stat-card"><div class="label">Total Movies</div><div class="value green" id="statMovies">-</div></div>
      </div>
      <div class="section">
        <div class="section-title">Recent Users</div>
        <table><thead><tr><th>Name</th><th>Email</th><th>Joined</th></tr></thead>
        <tbody id="recentUsersBody"></tbody></table>
      </div>
    </div>

    <!-- USERS -->
    <div class="tab-content" id="tab-users">
      <div class="section">
        <div class="section-title">All Users</div>
        <table><thead><tr><th>Name</th><th>Email</th><th>Joined</th><th>Action</th></tr></thead>
        <tbody id="allUsersBody"></tbody></table>
      </div>
    </div>

    <!-- MOVIES -->
    <div class="tab-content" id="tab-movies">
      <div class="section">
        <div class="section-title">All Movies</div>
        <table><thead><tr><th>Title</th><th>Type</th><th>Year</th><th>Rating</th><th>Action</th></tr></thead>
        <tbody id="allMoviesBody"></tbody></table>
      </div>
    </div>

    <!-- ADD MOVIE -->
    <div class="tab-content" id="tab-addmovie">
      <div class="section">
        <div class="section-title">Add New Movie / Show</div>
        <div class="form-row">
          <input id="mTitle" placeholder="Title">
          <select id="mType"><option value="movie">Movie</option><option value="show">Show</option></select>
        </div>
        <div class="form-row">
          <input id="mYear" placeholder="Year e.g. 2024" type="number">
          <input id="mRating" placeholder="Rating e.g. 8.5" type="number" step="0.1">
        </div>
        <div class="form-row">
          <input id="mDuration" placeholder="Duration e.g. 2h 30m">
          <input id="mGenre" placeholder="Genre e.g. Action,Drama">
        </div>
        <div class="form-row">
          <input id="mImage" placeholder="Image path e.g. images/movie/dune.jpg">
          <input id="mHeroImage" placeholder="Hero image path (optional)">
        </div>
        <div class="form-row">
          <input id="mDesc" placeholder="Description">
        </div>
        <button class="add-btn" onclick="addMovie()">➕ Add Movie</button>
        <div id="addMsg" style="margin-top:12px;font-size:13px;"></div>
      </div>
    </div>

  </div>
</div>

<script>
var ADMIN_KEY = '';
var API = 'http://localhost:5000/api/admin';

function doLogin() {
  var key = document.getElementById('adminKeyInput').value.trim();
  fetch(API + '/stats', { headers: { 'x-admin-key': key } })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.totalUsers !== undefined) {
        ADMIN_KEY = key;
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadOverview();
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }).catch(function(){ document.getElementById('loginError').style.display = 'block'; });
}

document.getElementById('adminKeyInput').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });

function headers() { return { 'Content-Type':'application/json', 'x-admin-key': ADMIN_KEY }; }

function showTab(name, el) {
  document.querySelectorAll('.tab-content').forEach(function(t){ t.classList.remove('active'); });
  document.querySelectorAll('.sidebar nav a').forEach(function(a){ a.classList.remove('active'); });
  document.getElementById('tab-' + name).classList.add('active');
  el.classList.add('active');
  var titles = { overview:'Overview', users:'Users', movies:'Movies', addmovie:'Add Movie' };
  document.getElementById('pageTitle').textContent = titles[name];
  if (name === 'users') loadUsers();
  if (name === 'movies') loadMovies();
  if (name === 'overview') loadOverview();
}

function loadOverview() {
  fetch(API + '/stats', { headers: headers() }).then(r=>r.json()).then(function(d){
    document.getElementById('statUsers').textContent  = d.totalUsers;
    document.getElementById('statMovies').textContent = d.totalMovies;
    var html = '';
    (d.recentUsers||[]).forEach(function(u){
      html += '<tr><td>' + u.name + '</td><td>' + u.email + '</td><td>' + new Date(u.createdAt).toLocaleDateString() + '</td></tr>';
    });
    document.getElementById('recentUsersBody').innerHTML = html || '<tr><td colspan="3" style="color:#64748b">No users yet</td></tr>';
  });
}

function loadUsers() {
  fetch(API + '/users', { headers: headers() }).then(r=>r.json()).then(function(users){
    var html = '';
    users.forEach(function(u){
      html += '<tr><td>' + u.name + '</td><td>' + u.email + '</td><td>' + new Date(u.createdAt).toLocaleDateString() + '</td><td><button class="del-btn" onclick="deleteUser(\'' + u._id + '\')">Delete</button></td></tr>';
    });
    document.getElementById('allUsersBody').innerHTML = html || '<tr><td colspan="4" style="color:#64748b">No users</td></tr>';
  });
}

function deleteUser(id) {
  if (!confirm('Delete this user?')) return;
  fetch(API + '/users/' + id, { method:'DELETE', headers: headers() }).then(function(){ loadUsers(); });
}

function loadMovies() {
  fetch(API + '/movies', { headers: headers() }).then(r=>r.json()).then(function(movies){
    var html = '';
    movies.forEach(function(m){
      html += '<tr><td>' + m.title + '</td><td><span class="badge ' + m.type + '">' + m.type + '</span></td><td>' + (m.year||'-') + '</td><td>' + (m.rating||'-') + '</td><td><button class="del-btn" onclick="deleteMovie(\'' + m._id + '\')">Delete</button></td></tr>';
    });
    document.getElementById('allMoviesBody').innerHTML = html || '<tr><td colspan="5" style="color:#64748b">No movies yet</td></tr>';
  });
}

function deleteMovie(id) {
  if (!confirm('Delete this movie?')) return;
  fetch(API + '/movies/' + id, { method:'DELETE', headers: headers() }).then(function(){ loadMovies(); });
}

function addMovie() {
  var body = {
    title:     document.getElementById('mTitle').value.trim(),
    type:      document.getElementById('mType').value,
    year:      parseInt(document.getElementById('mYear').value),
    rating:    parseFloat(document.getElementById('mRating').value),
    duration:  document.getElementById('mDuration').value.trim(),
    genre:     document.getElementById('mGenre').value.split(',').map(function(g){ return g.trim(); }),
    image:     document.getElementById('mImage').value.trim(),
    heroImage: document.getElementById('mHeroImage').value.trim(),
    description: document.getElementById('mDesc').value.trim()
  };
  if (!body.title) { document.getElementById('addMsg').innerHTML = '<span style="color:#ef4444">Title is required!</span>'; return; }
  fetch(API + '/movies', { method:'POST', headers: headers(), body: JSON.stringify(body) })
    .then(r=>r.json()).then(function(d){
      if (d._id) {
        document.getElementById('addMsg').innerHTML = '<span style="color:#00c853">✅ Movie added successfully!</span>';
        ['mTitle','mYear','mRating','mDuration','mGenre','mImage','mHeroImage','mDesc'].forEach(function(id){ document.getElementById(id).value=''; });
      } else {
        document.getElementById('addMsg').innerHTML = '<span style="color:#ef4444">' + (d.message||'Error') + '</span>';
      }
    });
}
</script>
</body>
</html>
